name: Blueprint specification validation
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spec-check deps
        run: pip install 'PyYAML>=6,<7'
      - name: Validate blueprint
        run: python scripts/validate_blueprint.py
      - name: Validate release package documentation
        run: python scripts/validate_release_pack_v1.2.py
      - name: Run unit tests for specifications only
        run: python -m unittest discover -s tests -v
      - name: Explain scope
        run: echo 'PASS means specification integrity only, NOT backend/frontend/mobile production quality.'
