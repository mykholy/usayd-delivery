x-corrections-to-existing:
- cid: C-01
  opid: post_bookings
  method: POST
  path: /api/v1/bookings
  issue: BookingRequest has no hold reference; no Idempotency-Key header; only 201/403/409/422 responses
  fix: Add `hold_id` (from P-30), require Idempotency-Key, add 401/429
  fr: FR-BOOK-001
- cid: C-02
  opid: get__api_v1_admin_security_access_audits
  method: GET
  path: /api/v1/admin/security/access-audits
  issue: Covers privileged access only; FR-SEC-004 also needs finance/judging/consent/token events
  fix: Add `category` + `actor_id` + `from/to` filters and cursor pagination
  fr: FR-SEC-004
- cid: C-03
  opid: post__auth_refresh
  method: POST
  path: /api/v1/auth/refresh
  issue: Rotation/reuse semantics undocumented
  fix: Document one-time refresh tokens; replay → 409 TOKEN_REUSED and family revocation
  fr: FR-IAM-008
- cid: C-04
  opid: patch__api_v1_me_preferences
  method: PATCH
  path: /api/v1/me/preferences
  issue: Preference schema has no UI mode for Kids/Professional/Simple (D-34/D-35)
  fix: Add `ui_mode` enum [kids, professional, simple]; server ignores it for authorization (presentation only)
  fr: FR-MOB-005
- cid: C-05
  opid: get__teachers
  method: GET
  path: /api/v1/teachers
  issue: Used with `?admin=1` by UX-ADMIN-007; a query flag must not unlock private fields
  fix: Remove the admin use; bind UX-ADMIN-007 to listAdminTeachers (P-07)
  fr: FR-SEC-001
- cid: C-06
  opid: get_bookings
  method: GET
  path: /api/v1/bookings
  issue: Used with `?admin=1` by UX-ADMIN-015; also returns only 200 (no error responses)
  fix: Bind admin to a scoped `listAdminBookings` (follow-up proposal) and add 401/403/422/429
  fr: FR-BOOK-004
- cid: C-07
  opid: get__competitions
  method: GET
  path: /api/v1/competitions
  issue: Used with `?admin=1` by UX-ADMIN-027; drafts must never be visible to learners
  fix: Bind admin to listAdminCompetitions (P-14)
  fr: FR-CONTEST-001
- cid: C-17
  opid: post__learning_plans__planId__approve
  method: POST
