            application/json:
              schema:
                $ref: '#/components/schemas/TeacherApplicationList'
        '401': *id004
        '403': *id005
        '429': *id006
        '422':
          description: VALIDATION_FAILED — bad filter/sort/cursor
          content:
            application/problem+json:
              schema: *id001
  /api/v1/teacher-applications:
    post:
      operationId: submitTeacherApplication
      summary: Submit a teacher application
      tags:
      - Teacher-Applications
      x-status: PROPOSED
      x-fr:
      - FR-TCHR-001
      - FR-MEDIA-003
      x-consumers:
      - UX-TEACHER-001
      x-journeys:
      - J03
      x-permission:
        roles:
        - authenticated_user
        scope: own application only; one open application per user
        enforced: server-side RBAC + ABAC + ownership (FR-IAM-004, FR-SEC-001)
      x-data-classification: confidential
      x-audit-event: teacher_application.submitted
      x-idempotency: Idempotency-Key required
      parameters:
      - &id007
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Same key + same body within 24 h returns the first result; same key + different body → 409 IDEMPOTENCY_MISMATCH
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherApplicationEnvelope'
        '401': *id004
        '403': *id005
        '429': *id006
        '409':
          description: APPLICATION_ALREADY_OPEN
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: VALIDATION_FAILED {field, code}
          content:
            application/problem+json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherApplicationRequest'
            example:
              languages:
              - ar
              - en
              teaching_areas:
              - memorization
              - tajweed
              riwayat:
              - hafs_an_asim
              document_upload_ids:
              - 7b1d0c1e-2f0a-4f1a-9b6c-0b2f3a1c9d10
              consent_receipt_id: 0e6f3a52-1c3e-4d5b-8f0a-2a4c6b8d0e12
  /api/v1/admin/teacher-applications/{applicationId}/decision:
    post:
      operationId: decideTeacherApplication
      summary: Accept/reject an application
      tags:
      - Admin
      x-status: PROPOSED
      x-fr:
      - FR-TCHR-001
      - FR-TCHR-005
      x-consumers:
      - UX-ADMIN-006
      x-journeys:
      - J03
      x-permission:
        roles:
        - academic_supervisor
        scope: market scope; decider ≠ the reviewer who ran the recitation interview; safeguarding_check must be cleared before approve
        enforced: server-side RBAC + ABAC + ownership (FR-IAM-004, FR-SEC-001)
      x-data-classification: confidential
      x-audit-event: teacher_application.decided
      x-idempotency: Idempotency-Key required
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id007
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherApplicationEnvelope'
        '401': *id004
        '403':
          description: SELF_DECISION_FORBIDDEN
          content:
            application/problem+json:
              schema: *id001
        '429': *id006
        '409':
          description: SAFEGUARDING_NOT_CLEARED
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: VALIDATION_FAILED {field, code}
          content:
            application/problem+json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
