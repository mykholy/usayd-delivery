openapi: 3.1.0
info:
  title: Usayd Academy API — PROPOSED additions (NOT APPROVED, NOT IMPLEMENTED)
  version: 1.3.0-proposal
  description: Proposals only. Merge into openapi.yaml operation by operation after product/tech-lead approval. Operations marked NEEDS_APPROVAL
    stay behind the named feature flag until the owner decision is recorded. `Problem` and `BearerAuth` refer to the baseline openapi.yaml.
servers:
- url: https://api.example.invalid
  description: Non-resolving placeholder origin; endpoint paths include /api/v1 exactly once.
security:
- BearerAuth: []
paths:
  /api/v1/admin/learners:
    get:
      operationId: listAdminLearners
      summary: Scoped learner directory
      tags:
      - Admin
      x-status: PROPOSED
      x-fr:
      - FR-IAM-004
      - FR-ADMIN-002
      - FR-PROF-004
      x-consumers:
      - UX-ADMIN-002
      x-journeys:
      - J11
      x-permission:
        roles:
        - platform_admin
        - support_agent
        - academic_supervisor
        scope: market/program scope; support sees only learners on open tickets
        enforced: server-side RBAC + ABAC + ownership (FR-IAM-004, FR-SEC-001)
      x-data-classification: confidential + child data (minimised)
      x-audit-event: admin.learner_list.viewed (sampled)
      x-idempotency: safe/read-only
      parameters:
      - name: market
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - limited
          - paused
          - closed
      - name: age_band
        in: query
        schema:
          type: string
          enum:
          - minor_under_13
          - minor_13_17
          - adult
      - name: q
        in: query
        schema:
          type: string
          maxLength: 64
        description: display_ref or learner id only; no name search for minors
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - display_ref
          - status
          - market
          default: display_ref
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - &id002
        name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor from `next_cursor`
      - &id003
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLearnerRowList'
        '401': &id004
          description: UNAUTHENTICATED
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
        '403': &id005
          description: FORBIDDEN_SCOPE — non-revealing; also consent/policy blocks
          content:
            application/problem+json:
              schema: *id001
        '429': &id006
          description: RATE_LIMITED — Retry-After header
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: VALIDATION_FAILED — bad filter/sort/cursor
          content:
            application/problem+json:
              schema: *id001
  /api/v1/admin/consents:
    get:
      operationId: listAdminConsents
      summary: Guardian consent queue
      tags:
      - Admin
      x-status: PROPOSED — NEEDS_APPROVAL
      x-fr:
      - FR-IAM-006
      - FR-IAM-007
      x-consumers:
      - UX-ADMIN-004
      x-journeys:
      - J02
      x-permission:
        roles:
        - platform_admin
        - safeguarding_lead
        scope: market scope
        enforced: server-side RBAC + ABAC + ownership (FR-IAM-004, FR-SEC-001)
      x-data-classification: child data
      x-feature-flag: guardian_consent_v1
      x-decision: O-04 (verification_method enum)
      x-idempotency: safe/read-only
      parameters:
      - name: state
        in: query
        schema:
          type: string
          enum:
          - requested
          - verified
          - granted
          - declined
          - withdrawn
          - expired
      - name: purpose
        in: query
        schema:
          type: string
          enum:
          - lessons
          - recording
          - competitions
          - ai_processing
          - marketing
      - name: market
        in: query
        schema: &id008
          type: string
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - expires_at
          - sent_at
          default: expires_at
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConsentRowList'
        '401': *id004
        '403': *id005
        '429': *id006
        '422':
          description: VALIDATION_FAILED — bad filter/sort/cursor
          content:
            application/problem+json:
              schema: *id001
