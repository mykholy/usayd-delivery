components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
    GenericItem:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
      deprecated: true
      description: DEPRECATED legacy placeholder; no operation may reference it in v1.1.
    GenericList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type:
          - string
          - 'null'
      deprecated: true
      description: DEPRECATED legacy placeholder; no operation may reference it in v1.1.
    RegisterRequest:
      type: object
      required:
      - name
      - contact
      - password
      - age_band
      - timezone
      - country_code
      properties:
        name:
          type: string
          minLength: 2
        contact:
          type: string
        password:
          type: string
          minLength: 10
        age_band:
          type: string
          enum:
          - adult
          - minor
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        timezone:
          type: string
          example: Africa/Cairo
        consent_versions:
          type: array
          items:
            type: string
    LoginRequest:
      type: object
      required:
      - contact
      - password
      properties:
        contact:
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      required:
      - access_token
      - expires_in
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
    ConsentRequest:
      type: object
      required:
      - purpose
      - consent_document_version
      - granted
      properties:
        purpose:
          type: string
          enum:
          - service
          - guardian_approval
          - audio_analysis
          - recording
          - marketing
          - public_competition_display
        consent_document_version:
          type: string
        granted:
          type: boolean
        subject_learner_id:
          type: string
          format: uuid
        guardian_verification_token:
          type: string
    LearnerRequest:
      type: object
      required:
      - goal
      - program_id
      properties:
        goal:
          type: string
        program_id:
          type: string
          format: uuid
        preferred_teacher_gender:
          type: string
          enum:
          - no_preference
          - male
          - female
        weekly_hours:
          type: number
          minimum: 0
          maximum: 40
    AvailabilityRequest:
      type: object
      required:
      - timezone
      - slots
      properties:
        timezone:
          type: string
        slots:
          type: array
          items:
            type: object
    AssessmentRequest:
      type: object
      required:
      - learner_id
      - program_id
      - rubric_id
      - dimensions
      properties:
        learner_id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        rubric_id:
          type: string
        dimensions:
          type: array
          items:
            type: object
        evidence_ids:
          type: array
          items:
            type: string
    ApprovalRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
        expected_version:
          type: integer
          minimum: 1
    PlanSuggestionRequest:
      type: object
      required:
      - learner_id
      - approved_assessment_id
      properties:
        learner_id:
          type: string
          format: uuid
        approved_assessment_id:
          type: string
          format: uuid
        weekly_available_minutes:
          type: integer
          minimum: 0
          maximum: 2400
    RevisionEvidenceRequest:
      type: object
      required:
      - result
      - source
      properties:
        result:
          type: string
          enum:
          - needs_review
          - partial
          - good
          - excellent
        source:
          type: string
          enum:
          - teacher
          - supervised_exam
          - learner_self_report
        evaluator_note:
          type: string
        evidence_ref:
          type: string
    BookingRequest:
      type: object
      required:
      - learner_id
      - teacher_id
      - start_at
      - program_id
      properties:
        learner_id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        start_at:
          type: string
          format: date-time
        timezone:
          type: string
        subscription_id:
          type: string
          format: uuid
    RescheduleRequest:
      type: object
      additionalProperties: false
      properties:
        target_slot_id:
          type: string
        expected_lesson_version:
          type: integer
      required:
      - target_slot_id
      - expected_lesson_version
    JoinResponse:
      type: object
      required:
      - provider
      - mode
      - expires_at
      - capabilities
      properties:
        provider:
          type: string
          enum:
          - livekit
          - videosdk
          - daily
          - zoom_video_sdk
          - zoom_meeting
          - google_meet
        mode:
          type: string
          enum:
          - embedded
          - external
        embed_token:
          type: string
        external_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        capabilities:
          type: object
          additionalProperties: true
    LessonReportRequest:
      type: object
      required:
      - covered_segments
      - revision_segments
      - homework_tasks
      properties:
        covered_segments:
          type: array
          items:
            type: string
        revision_segments:
          type: array
          items:
            type: string
        homework_tasks:
          type: array
          items:
            type: object
        teacher_notes:
          type: string
    SubscriptionRequest:
      type: object
      required:
      - package_id
      - learner_id
      properties:
        package_id:
          type: string
          format: uuid
        learner_id:
          type: string
          format: uuid
    CheckoutRequest:
      type: object
      required:
      - subscription_id
      - return_url
      properties:
        subscription_id:
          type: string
          format: uuid
        return_url:
          type: string
          format: uri
    ExamAttemptRequest:
      type: object
      properties:
        accessibility_accommodation_id:
          type: string
    ExamSubmitRequest:
      type: object
      required:
      - answers
      properties:
        answers:
          type: array
          items:
            type: object
        client_attempt_nonce:
          type: string
    ContestRegisterRequest:
      type: object
      required:
      - learner_id
      - terms_version
      properties:
        learner_id:
          type: string
          format: uuid
        terms_version:
          type: string
        public_display_opt_in:
          type: boolean
          default: false
    ContestSubmitRequest:
      type: object
      required:
      - round_id
      - payload
      properties:
        round_id:
          type: string
          format: uuid
        payload:
          type: object
        nonce:
          type: string
    ContestJudgeRequest:
      type: object
      required:
      - rubric_version
      - criterion_scores
      properties:
        rubric_version:
          type: string
        criterion_scores:
          type: object
          additionalProperties:
            type: number
        comments:
          type: string
    AppealRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 10
        evidence_id:
          type: string
    ContractRequest:
      type: object
      required:
      - model
      - effective_from
      - currency
      - rules
      properties:
        model:
          type: string
          enum:
          - salary
          - per_lesson
          - hourly
          - shift
          - hybrid
        effective_from:
          type: string
          format: date
        currency:
          type: string
          minLength: 3
          maxLength: 3
        rules:
          type: object
          additionalProperties: true
    ContestCreateRequest:
      type: object
      required:
      - title_ar
      - type
      - level_band
      - registration_ends_at
      - starts_at
      - rubric_version
      properties:
        title_ar:
          type: string
        type:
          type: string
        level_band:
          type: string
        registration_ends_at:
          type: string
          format: date-time
        starts_at:
          type: string
          format: date-time
        rubric_version:
          type: string
        privacy_mode:
          type: string
          enum:
          - private
          - pseudonym_opt_in
    FlagResolutionRequest:
      type: object
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - not_violation
          - coaching_needed
          - policy_violation
          - escalate
        reason:
          type: string
          minLength: 10
    SupportTicketRequest:
      type: object
      required:
      - category
      - message
      properties:
        category:
          type: string
          enum:
          - technical
          - billing
          - teacher
          - learning
          - safeguarding
        message:
          type: string
          minLength: 8
        lesson_id:
          type: string
          format: uuid
    WebhookRequest:
      type: object
      additionalProperties: true
    UserProfile:
      type: object
      required:
      - id
      - name
      - locale
