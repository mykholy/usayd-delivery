openapi: 3.1.0
info:
  title: Smart Quran Academy API — Draft Contract
  version: 1.2.0-draft
  description: Expanded contract draft for global markets, i18n, timezone, video provider settings and supervisors. Not a
    deployed API.
servers:
- url: https://api.example.invalid
  description: Non-resolving placeholder origin; endpoint paths include /api/v1 exactly once.
security:
- BearerAuth: []
